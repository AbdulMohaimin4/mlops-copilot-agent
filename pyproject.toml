[project]
name = "mlops-copilot-agent"
version = "0.1.0"
description = "Production-ready MLOps AI agent over DVC, MLflow, Airflow and Kubernetes"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dvc==3.67.1",
    "fastapi==0.163.1",
    "google-genai==3.3.0",
    "httpx==0.28.1",
    "joblib==1.6.0",
    "kubernetes==37.0.2",
    "mlflow-skinny==3.18.0",
    "pandas==3.1.1",
    "pydantic==2.14.3",
    "pyyaml==6.0.3",
    "scikit-learn==1.9.1",
    "skops==0.16.0",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pandas-stubs==3.1.0.261029",
    "pytest==9.2.0",
    "ruff==0.17.5",
    "types-pyyaml==6.0.12.20261113",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["kubernetes.*", "mlflow.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
