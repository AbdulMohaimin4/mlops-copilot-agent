apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-api
  namespace: mlops
  labels:
    app.kubernetes.io/name: inference-api
    app.kubernetes.io/version: model-v6
    app.kubernetes.io/part-of: mlops-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: inference-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inference-api
        app.kubernetes.io/version: model-v6
        app.kubernetes.io/part-of: mlops-agent
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: inference-api
          # Loaded into kind with `kind load docker-image`; never pulled from a registry.
          image: mlops-inference:model-v6
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: inference-config
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
